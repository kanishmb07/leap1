<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7f2">
    <title>Create account | TaskNest</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body class="auth-page">
    <header class="site-header auth-header">
        <a class="brand" href="index.html" aria-label="TaskNest home">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
            <span>TaskNest</span>
        </a>
        <a class="text-link" href="index.html">Back to home</a>
    </header>
    <main class="auth-layout">
        <section class="auth-aside">
            <p class="eyebrow"><span class="eyebrow-dot"></span> A FRESH START</p>
            <h1>Good plans<br>start <span>small.</span></h1>
            <p>Your tasks, priorities, and progress. All in one calm place.</p>
        </section>
        <section class="auth-form-wrap" aria-labelledby="register-heading">
            <div class="auth-form-heading">
                <p class="eyebrow">JOIN TASKNEST</p>
                <h2 id="register-heading">Create your account</h2>
                <p>A few details and you’re on your way.</p>
            </div>
            <form id="register-form" class="form-stack" novalidate>
                <label for="register-name">Name</label>
                <input id="register-name" name="name" type="text" autocomplete="name" placeholder="Your name" required maxlength="100">

                <label for="register-email">Email</label>
                <input id="register-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>

                <label for="register-password">Password</label>
                <input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required>
                <p class="field-hint">Use at least 6 characters.</p>

                <p id="register-message" class="form-message" role="status" aria-live="polite"></p>
                <button class="button button-dark button-wide" type="submit">Create account <span aria-hidden="true">→</span></button>
            </form>
            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>
</body>
</html>
